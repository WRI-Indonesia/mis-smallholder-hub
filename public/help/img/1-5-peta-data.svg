<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="judul keterangan" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="judul">Peta data Smallholder HUB MIS</title>
  <desc id="keterangan">Lembaga Petani menaungi banyak Petani. Setiap Petani dapat memiliki beberapa Lahan, dan setiap Lahan berisi Pohon. Kelompok Tani melekat pada Lahan, bukan pada Petani. Produksi dicatat per Lahan sekaligus atas nama Petani. Pelatihan diselenggarakan oleh Lembaga Petani dan diikuti oleh Petani.</desc>

  <!-- Latar sendiri: diagram harus terbaca di tema terang maupun gelap, jadi ia
       tidak boleh menumpang warna latar halaman. -->
  <rect x="0" y="0" width="900" height="440" rx="14" fill="#f7faf8" stroke="#dbe4df" stroke-width="1"/>

  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8078"/>
    </marker>
  </defs>

  <!-- Garis penghubung. Rute dijaga agar tidak menembus pil KT maupun kotak lain:
       Lahan → Produksi berangkat dari BAWAH pil, dan Petani → Produksi melengkung
       di celah antara kolom Petani dan Lahan. -->
  <g stroke="#6f8078" stroke-width="1.6" marker-end="url(#panah)" fill="none">
    <path d="M 206 88 L 256 88"/>
    <path d="M 420 88 L 470 88"/>
    <path d="M 634 88 L 688 88"/>
    <path d="M 555 158 L 555 262"/>
    <path d="M 341 120 L 341 262"/>
    <path d="M 117 120 L 117 300 L 256 300"/>
    <path d="M 420 104 C 446 104 446 300 470 300"/>
  </g>

  <g font-size="11" fill="#55625b">
    <text x="231" y="80" text-anchor="middle">menaungi</text>
    <text x="445" y="80" text-anchor="middle">memiliki</text>
    <text x="661" y="80" text-anchor="middle">berisi</text>
    <text x="349" y="205" text-anchor="start">mengikuti</text>
    <text x="563" y="215" text-anchor="start">panen dari</text>
    <text x="124" y="240" text-anchor="start">menyelenggarakan</text>
    <text x="404" y="238" text-anchor="end">atas nama</text>
  </g>

  <!-- Kotak entitas: isian terang + teks gelap, tidak bergantung latar halaman -->
  <g stroke="#b9c8c0" stroke-width="1.2" fill="#ffffff">
    <rect x="28" y="56" width="178" height="64" rx="8"/>
    <rect x="256" y="56" width="164" height="64" rx="8"/>
    <rect x="688" y="56" width="152" height="64" rx="8"/>
    <rect x="256" y="262" width="164" height="64" rx="8"/>
    <rect x="470" y="262" width="164" height="64" rx="8"/>
  </g>
  <!-- Lahan disorot: di sinilah Kelompok Tani tercatat -->
  <rect x="470" y="56" width="164" height="64" rx="8" fill="#ffffff" stroke="#12805a" stroke-width="1.8"/>

  <g text-anchor="middle" fill="#1f2a24">
    <g font-size="15" font-weight="600">
      <text x="117" y="84">Lembaga Petani</text>
      <text x="338" y="84">Petani</text>
      <text x="552" y="84">Lahan</text>
      <text x="764" y="84">Pohon</text>
      <text x="338" y="290">Pelatihan</text>
      <text x="552" y="290">Produksi</text>
    </g>
    <g font-size="11" fill="#55625b">
      <text x="117" y="104">asosiasi / koperasi (ICS)</text>
      <text x="338" y="104">anggota program</text>
      <text x="552" y="104">persil kebun</text>
      <text x="764" y="104">titik pohon sawit</text>
      <text x="338" y="310">kegiatan &amp; peserta</text>
      <text x="552" y="310">panen per bulan</text>
    </g>
  </g>

  <!-- Penegasan yang paling sering salah dipahami. Menempel di bawah kotak Lahan
       supaya terbaca sebagai bagian darinya, dan garis ke Produksi mulai dari
       bawah pil ini — bukan menembusnya. -->
  <g>
    <rect x="462" y="128" width="180" height="30" rx="15" fill="#eaf5f0" stroke="#12805a" stroke-width="1"/>
    <text x="552" y="147" text-anchor="middle" font-size="11" fill="#0f6b4c" font-weight="600">Kelompok Tani ada di sini</text>
  </g>
  <text x="764" y="150" text-anchor="middle" font-size="10.5" fill="#55625b">satu petani bisa punya</text>
  <text x="764" y="164" text-anchor="middle" font-size="10.5" fill="#55625b">lahan di KT berbeda</text>

  <text x="28" y="416" font-size="10.5" fill="#7a8a82">Arah panah: dari yang menaungi ke yang dinaungi. Satu kotak bisa punya banyak isi di sebelah kanannya.</text>
</svg>
