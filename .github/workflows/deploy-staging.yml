name: Deploy Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: STAGING_ENV_MIS_SMALLHOLDER
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          timeout: 60s
          command_timeout: 45m
          script: |
            set -Eeuo pipefail

            # LOAD NVM (opsional — `set -e` akan mematikan job tanpa pesan bila
            # nvm tidak terpasang dan tes `[ -s ... ]` gagal, jadi dibungkus if)
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then \. "$NVM_DIR/nvm.sh"; fi

            # CD
            cd /var/www/html/mis-staging

            # PULL
            git fetch origin
            git checkout staging
            git reset --hard origin/staging

            # ENV — dari secret MIS_STAGING_ENV (DB mis-staging + S3 dev)
            cat > .env <<'EOF'
            ${{ secrets.MIS_STAGING_ENV }}
            EOF
            chmod 600 .env

            # GUARD: gagal keras bila secret belum diisi (jangan deploy dengan .env kosong)
            grep -q "DATABASE_URL" .env || { echo "::error::secret MIS_STAGING_ENV kosong / tanpa DATABASE_URL — deploy dibatalkan"; exit 1; }

            # BUILD — `npm ci` (lock-file, tanpa audit/fund: lebih ringan & deterministik) dan
            # `free -m` sebelum/sesudah build sebagai jejak diagnosis memori (#340: OOM tanpa data).
            free -m || true
            npm ci --no-audit --no-fund

            # GUARD MIGRASI (#277, opsi 2): migrasi staging tetap MANUAL (DB dulu, baru push),
            # tetapi deploy tidak boleh mendaratkan kode baru di skema lama. `migrate status`
            # keluar non-0 bila ada migrasi pending (atau gagal) atau DB tak terjangkau — DB yang
            # LEBIH MAJU dari kode tetap lolos (dipakai rollback aplikasi, docs/standards/rollback.md) —
            # job berhenti SEBELUM build/reload, jadi aplikasi yang sedang jalan tidak tersentuh.
            # Sesudah `npm ci` agar versi Prisma CLI = lock-file.
            if ! MIGRATE_STATUS="$(npx prisma migrate status 2>&1)"; then
              echo "$MIGRATE_STATUS"
              echo "::error::Skema mis-staging belum sesuai kode (migrasi pending / DB tak terjangkau). Terapkan migrasi manual ke mis-staging (docs/database/migrations.md) lalu jalankan ulang deploy. Build & reload dibatalkan — aplikasi lama tetap jalan."
              exit 1
            fi
            echo "$MIGRATE_STATUS" | tail -n 2

            npx prisma generate
            npm run build
            free -m || true

            # RELOAD
            pm2 reload mis-staging || pm2 start npm --name "mis-staging" -- start -- -p 3000
